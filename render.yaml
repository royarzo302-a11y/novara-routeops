services:
  - type: web
    name: novara-routeops-demo
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NOVARA_DEMO_PASSWORD
        sync: false
